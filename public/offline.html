<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0B" />
    <title>Sem conexão · FinControl</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        padding: 0 20px;
        background: #0a0a0b;
        color: #f5f5f7;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      p.eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #8e8e93; }
      h1 { margin: 0; font-size: 34px; font-weight: 300; letter-spacing: -0.03em; line-height: 40px; }
      p { margin: 0; font-size: 15px; line-height: 21px; color: #8e8e93; max-width: 420px; }
      button {
        margin-top: 12px;
        align-self: flex-start;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        background: #0066dd;
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">FinControl</p>
    <h1>Sem conexão</h1>
    <p>Os dados ficam só no servidor, nunca guardados no aparelho. Assim que a internet voltar, é só tentar de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </body>
</html>
